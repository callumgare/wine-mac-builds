# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Regenerates the website and index (tools/site.py) from the published
# releases and metadata/, and uploads it to Cloudflare Pages
# (wine-mac-builds.cals.cafe). Nothing generated is committed; Cloudflare
# keeps every deployment, with rollback.
#
# The upload uses a Cloudflare API token that can only edit this Pages
# project, kept in the protected "cloudflare-pages" environment (only main
# may deploy). Until it's set up, the site is built and kept as an artifact
# but not uploaded.

name: site

on:
  push:
    branches: [main]
    paths: [metadata/**, tools/site.py, .github/workflows/site.yml]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  # A release event runs on the release's tag, which may not deploy; start
  # the same workflow on main instead.
  from-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  generate:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/site.py --out site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          if-no-files-found: error

  deploy:
    needs: generate
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    permissions: {}
    env:
      HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Note that deploying isn't set up yet
        if: env.HAVE_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN in the cloudflare-pages environment; the site was built (artifact 'site') but not uploaded."
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: env.HAVE_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=wine-mac-builds --branch=main
