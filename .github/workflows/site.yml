# SPDX-License-Identifier: LGPL-2.1-or-later
#
# Regenerates the website and index (tools/site.py) from the published
# releases and metadata/, and deploys it as a static-assets Cloudflare Worker
# (wrangler.jsonc; wine-mac-builds.cals.cafe). Nothing generated is
# committed; Cloudflare keeps every version, with rollback.
#
# The deploy uses a Cloudflare API token ("Workers Scripts: Edit" on the
# account), kept in the protected "cloudflare-pages" environment (only main
# may deploy). Until it's set up, the site is built and kept as an artifact
# but not uploaded.

name: site

on:
  push:
    branches: [main]
    paths: [metadata/**, tools/site.py, tools/sitegen/**, wrangler.jsonc, .github/workflows/site.yml]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  # A release event runs on the release's tag, which may not deploy; start
  # the same workflow on main instead.
  from-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  generate:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Published releases' files never change: keep them between runs,
      # by asset id (tools/site.py --cache).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/site-assets
          key: site-assets-${{ github.run_id }}
          restore-keys: site-assets-
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/site.py --out site --cache .cache/site-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/
          if-no-files-found: error

  deploy:
    needs: generate
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    permissions: {}
    env:
      HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: wrangler.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - name: Note that deploying isn't set up yet
        if: env.HAVE_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN in the cloudflare-pages environment; the site was built (artifact 'site') but not uploaded."
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: env.HAVE_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
